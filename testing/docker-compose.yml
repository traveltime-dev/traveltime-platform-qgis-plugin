version: "3"

services:
  # Runs tests (headless)
  tests:
    image: ${QGIS_IMAGE:?}
    volumes:
      # mount the plugin and default config (enabling the plugin) into both the
      # QGIS 3 and QGIS 4 profile locations, so the same service works with
      # both qgis/qgis:3.x and qgis/qgis:4.x images
      - ../travel_time_platform_plugin:/root/.local/share/QGIS/QGIS3/profiles/default/python/plugins/travel_time_platform_plugin
      - ../testing/QGIS3.ini:/root/.local/share/QGIS/QGIS3/profiles/default/QGIS/QGIS3.ini
      - ../travel_time_platform_plugin:/root/.local/share/QGIS/QGIS4/profiles/default/python/plugins/travel_time_platform_plugin
      - ../testing/QGIS3.ini:/root/.local/share/QGIS/QGIS4/profiles/default/QGIS/QGIS4.ini
      # include initialisation script (test launcher in QGIS)
      - ../testing/run_tests.py:/run_tests.py
      # mount artifacts folder
      - ../testing/artifacts:/tmp/ttp_tests
    environment:
      QT_QPA_PLATFORM: offscreen
      TEST_MODE: HEADLESS
      API_APP_ID: ${API_APP_ID:?}
      API_KEY: ${API_KEY:?}
    init: true # not sure why, but this is necessary for xvfb (see https://stackoverflow.com/a/72017110)
    entrypoint: xvfb-run
    command: qgis --code /run_tests.py

  # Runs tests (with visual feedback)
  tests-gui:
    extends: tests
    volumes:
      # mount the x11 socket to forward display to host
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      QT_QPA_PLATFORM: xcb
      TEST_MODE: HEADFULL
      DISPLAY: :0
    init: false
    entrypoint: ""
